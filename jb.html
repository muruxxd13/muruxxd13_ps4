      body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:0;

      body::after { content:""; position:fixed; inset:12px; pointer-events:none; z-index:3;
        border:1px solid rgba(0,229,255,.28); box-shadow:0 0 28px rgba(0,119,255,.24),inset 0 0 28px rgba(0,119,255,.1); }
      #brand {
        position:relative; z-index:1;
        text-align: center;
        padding: 14px 10px;
        background: rgba(3,8,28,.78);
        border-bottom: 1px solid rgba(0,229,255,.42);
        box-shadow:0 0 18px rgba(0,119,255,.22);
      }
      #brand img {

      #brand b {

        font-weight: 700;
        letter-spacing: 0.14em;
        color: #fff;
        text-shadow:0 0 10px #00e5ff;
        vertical-align: middle;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        position:relative; z-index:1; max-width:980px; margin:28px auto 60px;
        padding: 22px 24px;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: clamp(22px,4vw,34px);
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: rgba(1,7,24,.82);
        border: 1px solid rgba(0,229,255,.42);
        border-radius: 12px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
        box-shadow: inset 0 0 24px rgba(0,119,255,.12), 0 0 22px rgba(0,119,255,.18);
        text-shadow: 0 0 5px rgba(113,220,255,.35);
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
      #warn {
        padding: 14px 12px;
        background: #3a0f10;
        color: #ffdede;
        border-bottom: 2px solid #a5202a;
        text-align: center;
        font-weight: 900;
        font-size: 17px;
        letter-spacing: 0.08em;
        line-height: 1.35;
        text-transform: uppercase;
        text-shadow: 0 0 6px rgba(255, 60, 60, 0.45);
        animation: warnpulse 1.6s ease-in-out infinite;
      }
      #warn b { color: #ff5666; font-size: 19px; }
      @keyframes warnpulse {
        0%, 100% { background: #3a0f10; }
        50%      { background: #5a1418; }
      }
      #foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6px;
        text-align: center;
        font-size: 12px;
        color: #5c6672;
        letter-spacing: 0.06em;
        pointer-events: none;
        line-height: 1.5;
      }
      #foot b {
        color: #8b95a3;
        font-weight: 600;
      }
      #foot a {
        color: #7fa0c6;
        text-decoration: none;
        pointer-events: auto;
      }
      #foot .hint {

      @media (max-width:600px) { #wrap { margin:18px 24px 50px; padding:18px 14px; } }
      @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
